<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Smart Home Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap">
<style>
/* Slab UI after Lumen OS 2: solid colour slabs, giant numerals, no gradients, no glass, no shadows. One typeface. */
:root{--vw:1vw;--vh:1vh;--ink:#141414;--cream:#F3F0E8;--orange:#FF6A2B;--lilac:#C8B8FF;--lime:#DFFF5E;--sky:#7FD4FF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;--f-ui:var(--f-display);--f-mono:var(--f-display);color-scheme:light;background:var(--cream)}
:root:has(.stage[data-theme=dark]){background:var(--ink)}
:root:has(.stage[data-theme=frosted]){background:var(--orange)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:transparent;color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
h2,h3,h4,p{margin:0}
.stage{position:relative;min-height:100%;display:flex;flex-direction:column;padding-block:14px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  --r:28px;--page:var(--cream);--paper:var(--cream);--tx:var(--ink);--dockbg:var(--ink);--dockfg:var(--cream);--on-e:var(--cream);
  --c-a:var(--orange);--c-b:var(--lilac);--c-c:var(--lime);--c-d:var(--sky);--c-e:var(--ink);background:var(--page);color:var(--tx)}
.stage[data-theme=dark]{--page:var(--ink);--paper:#242422;--tx:var(--cream);--dockbg:var(--cream);--dockfg:var(--ink);--c-e:var(--cream);--on-e:var(--ink)}
.stage[data-theme=frosted]{--page:var(--orange);--c-e:var(--cream);--on-e:var(--ink)}
.stage[data-theme=frosted] .slot,.stage[data-theme=frosted] .dock,.stage[data-theme=frosted] .sheet{border:3px solid var(--ink)}
.stage[data-set=aurora]{--c-a:var(--lime);--c-b:var(--sky);--c-c:var(--orange);--c-d:var(--lilac)}
.stage[data-set=lagoon]{--c-a:var(--sky);--c-b:var(--lime);--c-c:var(--lilac);--c-d:var(--orange)}
.wall{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.photo .wall{display:block}

.board{position:relative;z-index:1;flex:1;align-content:start;display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr));grid-auto-rows:104px;grid-auto-flow:dense}
.sz-small{grid-column:span 4;grid-row:span 2}.sz-regular{grid-column:span 4;grid-row:span 3}.sz-large{grid-column:span 8;grid-row:span 4}
.slot{position:relative;min-height:0;min-width:0;border-radius:var(--r);--on:var(--ink);background:var(--sc);color:var(--on);--dim:color-mix(in srgb,var(--on) 66%,transparent)}
.s-a{--sc:var(--c-a)}.s-b{--sc:var(--c-b)}.s-c{--sc:var(--c-c)}.s-d{--sc:var(--c-d)}.s-e{--sc:var(--c-e);--on:var(--on-e)}
.s-x1{--sc:var(--c-b)}.s-x2{--sc:var(--c-c)}.s-x3{--sc:var(--c-d)}.s-x4{--sc:var(--c-a)}.s-x5{--sc:var(--c-b)}.s-x6{--sc:var(--c-c)}.s-x7{--sc:var(--c-d)}.s-x8{--sc:var(--c-a)}.s-x9{--sc:var(--c-b)}
.dockcell{grid-column:1/-1;display:flex;align-items:stretch;min-width:0;min-height:92px}
.dock{display:flex;justify-content:space-around;align-items:center;gap:8px;padding:10px;width:100%;border-radius:var(--r);background:var(--dockbg);color:var(--dockfg)}

.w{position:absolute;inset:0;container-type:size;border-radius:var(--r);overflow:hidden}
.in{position:absolute;inset:0;padding:clamp(14px,5cqmin,26px);display:flex;flex-direction:column;gap:clamp(8px,3cqmin,16px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--on) transparent}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:36px;min-height:26px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tag{font:600 11px var(--f-mono);padding:2px 9px;border:2px solid var(--on);border-radius:999px;white-space:nowrap}
.note{color:var(--dim);font-size:13px;text-wrap:pretty}
.gear{position:absolute;top:10px;right:10px;z-index:5;width:30px;height:30px;display:grid;place-items:center;border:0;border-radius:50%;background:var(--on);color:var(--sc);cursor:pointer;opacity:0;transition:opacity .15s}
.gear svg{width:18px;height:18px;fill:currentColor;stroke:none}
.slot:hover .gear,.gear:focus-visible{opacity:1}
@media (hover:none){.gear{opacity:.85}}
button:focus-visible,a:focus-visible{outline:3px solid var(--on,var(--ink));outline-offset:2px}

/* weather: the numeral is the design */
.bignum{font:800 clamp(80px,46cqmin,300px)/.8 var(--f-display);letter-spacing:-.06em;margin-left:-.05em;display:flex;align-items:flex-start;font-variant-numeric:tabular-nums}
.bignum sup{font-size:.3em;font-weight:700;margin:.12em 0 0 .08em;letter-spacing:0}
.wx-main{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.wx-cond{display:flex;align-items:center;gap:10px;font-size:clamp(15px,5cqmin,24px);font-weight:700;margin-top:14px}
.wx-cond svg,.dv-top svg{width:1.35em;height:1.35em;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.wx-range{color:var(--dim);font:600 13px var(--f-mono);margin-top:4px}
.hours{display:none;grid-template-columns:repeat(6,1fr);gap:6px;border-top:3px solid var(--on);padding-top:12px;text-align:center;font:600 12px var(--f-mono)}
.hours b{display:block;font:800 22px var(--f-display);margin-top:2px}
@container (min-height:300px){.hours{display:grid}}

/* now playing */
.mu-head{display:flex;align-items:center;gap:14px;min-width:0}
.mu-art{--h:210;flex:none;width:clamp(52px,24cqmin,120px);aspect-ratio:1;border-radius:calc(var(--r)*.5);background:hsl(var(--h) 90% 64%);position:relative}
.mu-art i{position:absolute;inset:28%;border-radius:50%;border:3px solid var(--ink)}
.mu-meta{display:flex;flex-direction:column;min-width:0}
.mu-title{font:800 clamp(17px,6cqmin,24px)/1.15 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mu-artist{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.mu-bar{display:flex;align-items:center;gap:10px;font:600 11px var(--f-mono);color:var(--dim)}
.track{flex:1;height:18px;display:flex;align-items:center;cursor:pointer;position:relative}
.track::before{content:"";position:absolute;left:0;right:0;height:8px;border-radius:4px;background:color-mix(in srgb,var(--on) 22%,transparent)}
.track i{position:relative;height:8px;border-radius:4px;background:var(--on);display:block}
.mu-ctl{display:flex;justify-content:center;align-items:center;gap:14px}
.ctl{width:40px;height:40px;display:grid;place-items:center;border:0;border-radius:50%;background:transparent;cursor:pointer}
.ctl svg{width:20px;height:20px;stroke:currentColor;fill:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ctl.main{width:54px;height:54px;background:var(--on);color:var(--sc)}
.demo{display:none;text-align:center;font-size:11px;color:var(--dim)}
@container (min-height:270px){.demo{display:block}}

/* todo */
.td-list{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:4px}
.td-list li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:2px solid color-mix(in srgb,var(--on) 20%,transparent);font-weight:600}
.td-list li span{flex:1;min-width:0;overflow-wrap:anywhere}
.td-list li.done span{text-decoration:line-through;text-decoration-thickness:2px;color:var(--dim)}
.td-list li.empty{color:var(--dim);border:0}
.chk{flex:none;width:24px;height:24px;border-radius:8px;border:3px solid var(--on);background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
.done .chk{background:var(--on);color:var(--sc)}
.chk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.rm{flex:none;width:26px;height:26px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;opacity:.6;padding:0}
.rm:hover{opacity:1}
.rm svg,.iconbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.td-add,.sr-form{display:flex;gap:8px}
.iconbtn{flex:none;width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--on);border-radius:50%;background:transparent;cursor:pointer;padding:0;text-decoration:none;color:inherit}
.iconbtn.solid{background:var(--on);color:var(--sc)}

/* device */
.dv-top{display:flex;align-items:center;gap:14px}
.dv-top svg{width:clamp(34px,10cqmin,56px);height:auto;aspect-ratio:1}
.dv-state{font:800 clamp(28px,11cqmin,56px)/1 var(--f-display);letter-spacing:-.03em}
.dv-sub{color:var(--dim);font:600 12px var(--f-mono);margin-top:4px}
.dv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px 28px}
.dv-grid h4{margin-bottom:6px}
.dv-grid dl{margin:0}
.dv-grid dl div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:2px solid color-mix(in srgb,var(--on) 20%,transparent)}
.dv-grid dt{color:var(--dim)}
.dv-grid dd{margin:0;font:600 12.5px var(--f-mono);text-align:right;overflow-wrap:anywhere}

/* search, clock, notes, controls */
.sr,.ck{justify-content:center}
.sr-title{font:800 clamp(24px,10cqmin,44px)/1 var(--f-display);letter-spacing:-.03em}
.ck-time{font:800 clamp(64px,34cqmin,240px)/.82 var(--f-display);letter-spacing:-.06em;margin-left:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ck-date{font-size:clamp(14px,5cqmin,22px);font-weight:700;color:var(--dim)}
.nt textarea{flex:1;resize:none;min-height:60px}
.ct-list{display:flex;flex-direction:column;gap:14px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:600}
.sw{appearance:none;-webkit-appearance:none;flex:none;position:relative;width:54px;height:32px;margin:0;border-radius:999px;background:transparent;border:3px solid var(--on);cursor:pointer}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--on);transition:transform .2s,background .2s}
.sw:checked{background:var(--on)}
.sw:checked::before{transform:translateX(22px);background:var(--sc)}
.sw:focus-visible{outline:3px solid var(--on);outline-offset:3px}
.rng{--p:50%;appearance:none;-webkit-appearance:none;width:100%;height:28px;background:transparent;margin:0;cursor:pointer}
.rng::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--on) var(--p),color-mix(in srgb,var(--on) 22%,transparent) var(--p))}
.rng::-moz-range-track{height:8px;border-radius:4px;background:color-mix(in srgb,var(--on) 22%,transparent)}
.rng::-moz-range-progress{height:8px;border-radius:4px;background:var(--on)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;border:4px solid var(--sc,var(--paper));background:var(--on)}
.rng::-moz-range-thumb{width:18px;height:18px;border-radius:50%;border:4px solid var(--sc,var(--paper));background:var(--on)}
.rng:focus-visible{outline:3px solid var(--on);outline-offset:3px;border-radius:14px}
.seg{display:flex;gap:4px;padding:4px;border-radius:calc(var(--r)*.6);border:2px solid var(--on)}
.seg button{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:calc(var(--r)*.45);cursor:pointer;font-weight:700;white-space:nowrap}
.seg button[aria-checked=true]{background:var(--on);color:var(--sc)}
.btn{border:2px solid var(--on);background:transparent;border-radius:999px;padding:10px 20px;font-weight:700;cursor:pointer}
.btn:hover{background:var(--on);color:var(--sc)}
.ct-row{display:flex;justify-content:space-between;margin-bottom:4px;font-weight:600}
.ct-row b{font:800 20px var(--f-display)}

/* fields */
.field{font:inherit;font-weight:500;color:var(--on);background:color-mix(in srgb,var(--on) 8%,transparent);border:2px solid var(--on);border-radius:calc(var(--r)*.55);padding:10px 14px;min-width:0;width:100%;outline:none}
.field:focus-visible{box-shadow:inset 0 0 0 2px var(--on)}
.field::placeholder{color:var(--dim)}
select.field option{color:var(--ink);background:var(--cream)}
textarea.field{line-height:1.5}

/* sheets: a big slab over the board */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:color-mix(in srgb,var(--ink) 38%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{position:relative;width:min(620px,100%);border-radius:min(var(--r),36px);--sc:var(--paper);--on:var(--tx);--dim:color-mix(in srgb,var(--on) 66%,transparent);background:var(--sc);color:var(--on)}
.sheeted .board{opacity:.3;pointer-events:none}
.board{transition:opacity .2s}
.toast{position:fixed;z-index:60;top:max(16px,env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;max-width:min(520px,calc(100% - 32px));padding:12px 20px;border-radius:999px;font-weight:700;background:var(--dockbg);color:var(--dockfg)}
.toast svg{flex:none;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.sb{position:relative;max-height:min(calc(var(--vh)*82),780px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:22px;outline:none;scrollbar-width:thin;scrollbar-color:var(--on) transparent}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sh-head h2{font:800 34px/1 var(--f-display);letter-spacing:-.04em}
.sb section{display:flex;flex-direction:column;gap:10px}
.sb h3{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.srow{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:12px}
.srow output{font:700 12px var(--f-mono);text-align:right}
.wps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.wp{aspect-ratio:8/5;border-radius:calc(var(--r)*.4);background-size:cover;background-position:center;border:3px solid transparent;cursor:pointer;padding:0;position:relative;color:var(--ink)}
.wp[data-set=dusk]{background:var(--orange)}.wp[data-set=aurora]{background:var(--lime)}.wp[data-set=lagoon]{background:var(--sky)}
.wp[aria-pressed=true]{border-color:var(--on)}
.wp.up{background:transparent;border:2px dashed var(--on);color:var(--on);font-size:12px;font-weight:700;display:grid;place-items:center;text-align:center;padding:6px}
.wp span{position:absolute;left:6px;bottom:5px;font-size:11px;font-weight:700;background:var(--ink);color:var(--cream);padding:1px 7px;border-radius:6px}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.link{align-self:flex-start;background:none;border:0;padding:0;color:var(--dim);text-decoration:underline;cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;border:2px solid var(--on);border-radius:calc(var(--r)*.6);background:transparent;cursor:pointer}
.card svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card span{color:var(--dim);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:8px 14px;border:2px solid var(--on);border-radius:999px;background:transparent;cursor:pointer;font-weight:700}
.chip small{color:var(--dim);font-size:11px;font-weight:500}
.card[aria-pressed=true],.chip[aria-pressed=true]{background:var(--on);color:var(--sc)}
.card[aria-pressed=true] span,.chip[aria-pressed=true] small{color:inherit;opacity:.75}
.fl{display:flex;flex-direction:column;gap:4px}
.fl>span{color:var(--dim);font-size:12px;font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.lbl{font-weight:700}
.dockbtn{width:52px;height:52px;display:grid;place-items:center;border:0;border-radius:calc(var(--r)*.6);background:color-mix(in srgb,var(--dockfg) 14%,transparent);color:inherit;cursor:pointer;padding:0;transition:background .12s,color .12s}
.dockbtn:hover,.dockbtn:focus-visible{background:var(--lime);color:var(--ink)}
.dockbtn svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

.s-f{--sc:var(--c-c)}.s-g{--sc:var(--c-a)}.s-h{--sc:var(--c-b)}
.nw-list{list-style:none;margin:0;padding:0;flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:2px}
.nw-list li{padding:8px 0;border-bottom:2px solid color-mix(in srgb,var(--on) 20%,transparent);display:flex;flex-direction:column;gap:2px}
.nw-list a{color:inherit;font-weight:700;line-height:1.25;text-decoration:none}
.nw-list a:hover{text-decoration:underline;text-decoration-thickness:2px}
.nw-list small{color:var(--dim);font-weight:600}
.nw-list li.empty{color:var(--dim);border:0}
.dbg-dl{margin:0}
.dbg-dl div{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:2px solid color-mix(in srgb,var(--on) 20%,transparent)}
.dbg-dl dt{color:var(--dim)}.dbg-dl dd{margin:0;font:600 12px var(--f-mono);text-align:right;overflow-wrap:anywhere}
.dbg-log{margin:0;font:600 11px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:var(--dim)}
.dbg .slot{outline:2px dashed var(--ink);outline-offset:-6px}
.dbg .slot::after{content:attr(data-slot);position:absolute;left:8px;bottom:8px;z-index:6;background:var(--on);color:var(--sc);font:800 11px var(--f-mono);padding:1px 7px;border-radius:6px;text-transform:uppercase;pointer-events:none}
.abt{margin:0}.abt div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:2px solid color-mix(in srgb,var(--on) 20%,transparent);font-weight:600}
.abt dt{color:var(--dim)}.abt dd{margin:0;text-align:right}
.abt button{background:none;border:0;padding:4px 0;font-weight:700;cursor:pointer}
.egg{display:grid;place-items:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:8px 0}
.egg svg{width:min(320px,80%);height:auto;overflow:visible}
.egg circle{transition:transform .6s cubic-bezier(.3,1.4,.5,1)}
.swrow small{display:block;font-weight:500}
.mp-frame{flex:1;min-height:0;width:100%;border:3px solid var(--on);border-radius:calc(var(--r)*.5);background:var(--cream)}
a.tag{color:inherit;text-decoration:none}
.fact-t{flex:1;display:flex;align-items:center;margin:0;font:800 clamp(20px,8cqmin,34px)/1.1 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.ph-view{flex:1;min-height:0;border-radius:calc(var(--r)*.5);background:var(--on) center/cover no-repeat}
.ph-view.empty{display:grid;place-items:center;background:transparent;border:3px dashed var(--on);font-weight:700;color:var(--dim)}
.ph .btns{gap:8px;align-items:center}
.chip:disabled,.btn:disabled{opacity:.4;cursor:not-allowed}
.kiosk .gear{display:none}.kiosk .dock{width:auto;margin-left:auto;opacity:.6}
/* Puma launcher */
.puma{position:fixed;inset:0;z-index:20;background:var(--page);color:var(--tx);overflow:hidden}
.lk{position:absolute;inset:0;display:flex;flex-direction:column;--s:min(calc(var(--vw)*62),calc(var(--vh)*44))}
.lk-h,.lk-m{font:800 var(--s)/.8 var(--f-display);letter-spacing:-.07em;white-space:nowrap;font-variant-numeric:tabular-nums}

function fileToWall(file) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(file.type)) return rej(new Error("That file is not an image."));
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, 1920 / Math.max(im.width, im.height)), cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(im.width * s)); cv.height = Math.max(1, Math.round(im.height * s));
        cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", 0.86));
      };
      im.onerror = () => rej(new Error("Could not read that image."));
      im.src = fr.result;
    };
    fr.onerror = () => rej(new Error("Could not read that file."));
    fr.readAsDataURL(file);
  });
}

/* ---------- files ---------- */
async function saveFile() {
  const json = JSON.stringify(state, null, 2), base = "my-smart-home";
  let dl = null;
  try { dl = await window.claude?.use?.("downloads"); } catch {}
  if (dl) {
    try { await dl.save({ filename: base + ".smrtpage", data: json }); note("Saved " + base + ".smrtpage"); return; }
    catch (err) {
      if (err?.code === "declined") return;
      if (err?.code === "rejected_extension" || err?.code === "extension_not_enabled") {
        try { await dl.save({ filename: base + ".smrtpage.json", data: json }); note("Saved as " + base + ".smrtpage.json. Rename it to .smrtpage if you like; both open here."); }
        catch (e2) { if (e2?.code !== "declined") note("Saving is not available in this view.", "alert"); }
        return;
      }
      note("Saving is not available in this view.", "alert"); return;
    }
  }
  const url = URL.createObjectURL(new Blob([json], { type: "application/json" })), a = document.createElement("a");
  a.href = url; a.download = base + ".smrtpage"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  note("Saved " + base + ".smrtpage");
}
$("#openFile").addEventListener("change", async (e) => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f) return;
  if (f.size > 30e6) return note("That file is too large to be a save file.", "alert");
  try {
    const o = JSON.parse(await f.text());
    if (!o || o.format !== "smrtpage") throw new Error("not a save");
    state = sanitize(o); mu.pos = 0; mu.playing = false; changed(true); note("Loaded " + f.name);
  } catch { note("That is not a .smrtpage save file.", "alert"); }
});
$("#photoFile").addEventListener("change", async (e) => {
  const fs = [...e.target.files]; e.target.value = "";
  const first = photos.length;
  for (const f of fs) {
    if (photos.length >= 12) { note("Up to 12 photos.", "alert"); break; }
    try { photos.push(await fileToPhoto(f)); } catch (err) { note(err.message, "alert"); }
  }
  if (photos.length > first) { pi = first; savePhotos(); renderType("photos"); }
});
$("#wallFile").addEventListener("change", async (e) => {

  catch (err) { note(err.message, "alert"); }

    case "gv-prev": if (photos.length) { ui.gv = (ui.gv - 1 + photos.length) % photos.length; renderApp(); } break;
    case "gv-next": if (photos.length) { ui.gv = (ui.gv + 1) % photos.length; renderApp(); } break;
    case "gv-grid": ui.gv = -1; renderApp(); break;
    case "gv-del": photos.splice(ui.gv, 1); ui.gv = -1; pi = 0; savePhotos(); renderApp(); break;
    case "cam-flip": camFace = camFace === "user" ? "environment" : "user"; startCam(); break;
    case "cam-snap": snap(); break;
    case "mk-tab": ui.mk = el.dataset.v; renderApp(); break;
    case "mk-app": { const k = el.dataset.k, l = state.puma.apps, i = l.indexOf(k); if (i >= 0) l.splice(i, 1); else l.push(k); persist(); renderApp(); break; }
    case "mk-add": if (state.extra < 9) { state.extra++; const x = "x" + state.extra; state.slots[x] = type; state.sizes[x] = state.puma.wdg.find((w) => "pw:" + w.id === type)?.size || "regular"; persist(); build(); if (ui.mode === "interface" && ui.screen === "app" && ui.app === "market") renderApp(); if (sheet?.kind === "settings") renderSheet(); note(TYPES[type].name + " added to the display"); } break;
    case "size": if (SZ[el.dataset.v]) { state.sizes[slot] = el.dataset.v; persist(); build(); renderSheet(); } break;
    case "x-remove": { const last = "x" + state.extra; state.slots[slot] = state.slots[last]; state.sizes[slot] = state.sizes[last]; state.extra--; persist(); closeSheet(); build(); break; }
    case "add-ask": sheet.adding = true; renderSheet(); break;
    case "add-n": { const n = Math.min(+el.dataset.v, 9 - state.extra); state.extra += n; sheet.adding = false; persist(); build(); renderSheet(); note(`Added ${n} widget${n > 1 ? "s" : ""}. Open a tile's menu to choose what it shows.`); break; }
    case "pin-set": askPin(state.puma.pin ? "old" : "new"); break;
    case "pin-remove": askPin("verify", () => { state.puma.pin = null; persist(); note("Passcode removed"); }); break;
    case "key": pinKey(el.dataset.v); break;
    case "ring-stop": closeSheet(); break;
    case "ring-snooze": snooze = { at: Date.now() + 300000, m: sheet.msg }; closeSheet(); note("Snoozed for 5 minutes"); break;
    case "wx-refresh": loadWeather(); break;
    case "news-refresh": loadNews(); break;
    case "wx-geo":
      if (!navigator.geolocation) { note("Location is not available here.", "alert"); break; }
      navigator.geolocation.getCurrentPosition((p) => { const w = state.data.weather; w.lat = p.coords.latitude; w.lon = p.coords.longitude; w.city = "My location"; persist(); loadWeather(); renderSheet(); }, () => note("Location is not available here.", "alert"));
      break;
    case "egg": egg.k++; clearTimeout(egg.kt); egg.kt = setTimeout(() => (egg.k = 0), 1500);
      if (egg.k >= 3) { egg.k = 0; Object.assign(egg, { a: 0, c: 0, n: 0, msg: "Tap to spin. Press and hold for a surprise." }); openSheet({ kind: "egg" }); } break;
    case "egg-tap": if (egg.long) { egg.long = false; break; } egg.a += 40; egg.c++; egg.n++; egg.msg = egg.n >= 10 ? egg.n + " taps. Hub 6 feels spoiled." : "Taps: " + egg.n; eggUI(); break;
    case "build": dev.n++; clearTimeout(dev.t); dev.t = setTimeout(() => (dev.n = 0), 2000);
      if (state.exp.debug) { note("You are already a developer."); break; }
      if (dev.n >= 7) { dev.n = 0; state.exp.debug = true; persist(); applyLook(); renderSheet(); note("You are now a developer! Debug widgets are on."); }
      else if (dev.n >= 4) note(7 - dev.n + " taps away from being a developer."); break;
    case "mu-play": mu.playing = !mu.playing; muUI(); break;
    case "mu-prev": skip(-1); break;
    case "mu-next": skip(1); break;
    case "mu-seek": { const r = el.getBoundingClientRect(); mu.pos = clamp((e.clientX - r.left) / r.width, 0, 1) * curTrack().d; muUI(); break; }
  }
});
stage.addEventListener("submit", (e) => {
  const f = e.target.closest("[data-form]");
  if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "td-add") {
    const inp = $("input", f), v = inp.value.trim();
    if (!v) return;
    state.data.todo.push({ id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), t: v.slice(0, 120), done: false });
    const slot = f.closest("[data-w]").dataset.w;
    persist(); renderType("todo"); keepFocus(`#td-in-${slot}`);
  } else if (f.dataset.form?.startsWith("acc-")) {
    accForm(f);
  } else if (f.dataset.form === "lynk") {
    const v = $("input", f).value.trim();
    if (v && !lynk.busy) lynkSend(v);
  } else if (f.dataset.form === "tk-add") {
    const v = $("input", f).value.trim();
    if (v) { state.data.todo.push({ id: "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), t: v.slice(0, 120), done: false }); persist(); renderType("todo"); $("#tk-in")?.focus(); }
  } else if (f.dataset.form === "alarm") {
    const t = $("#al-t").value;
    if (/^\d{2}:\d{2}$/.test(t)) { state.puma.alarms.push({ id: "a" + Date.now().toString(36), t, l: $("#al-l").value.trim().slice(0, 30), on: true }); state.puma.alarms.sort((a, b) => (a.t < b.t ? -1 : 1)); persist(); renderApp(); }
  } else if (f.dataset.form === "wxcity") {
    const v = $("input", f).value.trim();
    if (v) { const w = state.data.weather; w.city = v.slice(0, 40); w.lat = w.lon = null; loadWeather(); }
  } else if (f.dataset.form === "maps") {
    const q = $("input", f).value.trim();
    if (q) geocodeMap(q);
  } else if (f.dataset.form === "search") {
    const v = $("input", f).value.trim();
    if (v) $("a", f).click();
  }
});
function onOpt(el) {
  const [type, key] = el.dataset.opt.split("."), v = el.value;
  if (type === "weather") {
    const w = state.data.weather;
    if (key === "city") { w.city = v.trim().slice(0, 40) || w.city; w.lat = w.lon = null; setTimeout(loadWeather, 0); }
    else if (key === "cond") w.cond = COND.includes(v) ? v : w.cond;
    else if (isFinite(parseFloat(v))) w[key] = clamp(Math.round(parseFloat(v)), -60, 60);
    renderType("weather");
  } else if (type === "music") {
    const tr = v.split("\n").map((l) => l.trim()).filter(Boolean).slice(0, 30).map((l) => {
      const parts = l.split(/\s+[—–-]\s+/); let d = 210;
      if (parts.length > 1 && /^\d{1,2}:\d{2}$/.test(parts[parts.length - 1])) { const [mm, ss] = parts.pop().split(":"); d = clamp(+mm * 60 + +ss, 30, 3600); }
      return { t: parts[0].slice(0, 60), a: (parts[1] || "Unknown artist").slice(0, 60), d };
    });
    if (tr.length) { state.data.music = { tracks: tr, i: 0 }; mu.pos = 0; renderType("music"); }
    renderSheet();
  }
  persist();
}
stage.addEventListener("change", (e) => {
  const t = e.target;
  if (t.matches?.("[data-opt]")) return onOpt(t);
  if (t.matches?.("input[data-lk]")) { const k = t.dataset.lk, v = t.value.trim(); if (k === "url" && /^https?:\/\/[^\s]{1,100}$/.test(v)) state.puma.lynk.url = v; else if (k === "model" && /^[\w.:\/-]{1,60}$/.test(v)) state.puma.lynk.model = v; else { t.value = state.puma.lynk[k]; return; } persist(); return; }
  if (t.matches?.("input.sw[data-al]")) { const a = state.puma.alarms.find((x) => x.id === t.dataset.al); if (a) { a.on = t.checked; persist(); } return; }
  if (t.matches?.("input.sw[data-pm]")) { if (t.dataset.pm === "gate") { state.puma.gate = t.checked; persist(); renderSheet(); return; } state.puma.dm = t.checked; persist(); applyLook(); if (t.checked) { closeSheet(); enterDisplay(false); note("Display Mode will stay on."); } else renderSheet(); return; }
  if (t.matches?.("input.sw[data-exp]")) { state.exp[t.dataset.exp] = t.checked; persist(); if (t.dataset.exp === "live") { loadWeather(); loadNews(); loadFacts(); } build(); renderSheet(); }
  else if (t.matches?.('input.rng[data-k="heat"]')) persist();
});
stage.addEventListener("input", (e) => {
  const t = e.target;
  if (t.matches?.("input[data-tint]")) { state.tint = t.value; stage.style.setProperty("--tint", t.value); persist(); return; }
  if (t.matches?.(".sr-form input")) { const f = t.closest("form"), q = t.value.trim(), lk = $("a", f); if (lk) lk.href = q ? "https://www.google.com/search?q=" + encodeURIComponent(q) : "https://www.google.com/"; return; }
  if (t.matches?.(".nt textarea")) { state.data.notes = t.value; persist(); return; }
  if (!t.matches?.("input.rng[data-k]")) return;
  const k = t.dataset.k, v = parseFloat(t.value), lo = +t.min, hi = +t.max;
  t.style.setProperty("--p", ((v - lo) / (hi - lo)) * 100 + "%");
  if (k === "heat") { state.data.controls.heat = v; $$("[data-heat]").forEach((n) => (n.textContent = v + "°C")); }
  else { state[k] = k === "radius" ? clamp(v, 8, 48) : clamp(v, 0, 40); const o = $("#out-" + k); if (o) o.textContent = k === "radius" ? v + "px" : v; applyLook(); }
  persist();
});
function eggUI() {
  $$(".egg circle").forEach((c, i) => { c.setAttribute("stroke", EGGC[(i + egg.c) % 5]); c.style.transform = `rotate(${egg.a * (i % 2 ? -1 : 1) * (i + 1)}deg)`; });

stage.addEventListener("pointerdown", (e) => {

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && sheet) closeSheet();
  else if (sheet?.kind === "pass" && /^[0-9]$/.test(e.key)) pinKey(e.key);
  else if (sheet?.kind === "pass" && e.key === "Backspace") pinKey("del");

let dt;
const refreshDevice = () => { clearTimeout(dt); dt = setTimeout(() => renderType("device"), 200); };
["online", "offline", "resize"].forEach((ev) => addEventListener(ev, refreshDevice));
try { (navigator.connection || {}).addEventListener?.("change", refreshDevice); } catch {}
try { navigator.getBattery?.().then((b) => { batt = b; ["levelchange", "chargingchange"].forEach((ev) => b.addEventListener(ev, refreshDevice)); refreshDevice(); }).catch(() => {}); } catch {}

ui.mode = state.puma.dm ? "display" : "interface";
regWidgets();
